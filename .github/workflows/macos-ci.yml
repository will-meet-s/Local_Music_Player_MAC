name: macOS CI

on:
  push:
    branches: ['feature/**', 'ci/baseline']
    tags: ['mac-test-*', 'mac-baseline-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      VERSION: 1.0.0-ci.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - name: 工具链版本
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: 编译（release）
        run: |
          set -o pipefail
          swift build -c release 2>&1 | tee swift-build.log

      - name: 单测
        run: |
          set -o pipefail
          swift test 2>&1 | tee swift-test.log

      - name: 失败用例写成 annotations
        if: failure()
        run: bash scripts/ci-test-annotations.sh swift-build.log swift-test.log

      - name: 打包 .app 和 .dmg
        run: make dmg VERSION="$VERSION"

      - name: 计算 artifact 名
        id: name
        run: |
          ref="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          echo "artifact=MacMusicPlayer-${ref//\//-}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [[ "$ref" == "ci/baseline" || "$GITHUB_REF_TYPE" == "tag" ]]; then echo "days=90"; else echo "days=14"; fi >> "$GITHUB_OUTPUT"

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: build/MacMusicPlayer-${{ env.VERSION }}.dmg
          if-no-files-found: error
          retention-days: ${{ steps.name.outputs.days }}

  # v3：只在推送测试包标签时运行，把上面 build job 产出的 .dmg 发布成公开 Release
  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          notes="docs/test-packages/${tag}.md"
          [[ -f "$notes" ]] || { echo "::error title=缺少本包清单::没有 $notes，先提交清单再打标签"; exit 1; }
          gh release create "$tag" dist/*.dmg --prerelease --title "$tag" --notes-file "$notes"
